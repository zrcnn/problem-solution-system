<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 现场问题解决方案管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #999;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fff2f0;
            color: #f5222d;
            border: 1px solid #ffccc7;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>管理员登录</h1>
            <p>现场问题解决方案管理系统</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="请输入用户名" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="请输入密码" required>
            </div>

            <button type="submit" class="btn-primary">登 录</button>
        </form>

        <div class="footer">
            © 2024 杭州盾源科技有限公司
        </div>
    </div>

    <script>
        // 更新API请求封装，自动添加Authorization header
        async function apiRequest(url, method = 'GET', data = null) {
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                },
            };
            
            // 每次请求时重新获取token，确保使用最新的
            const authToken = localStorage.getItem('admin_token');
            if (authToken) {
                options.headers['Authorization'] = `Bearer ${authToken}`;
            }
            
            if (data) {
                options.body = JSON.stringify(data);
            }
            const response = await fetch(url, options);
            
            // 如果返回401，说明token过期或无效，跳转到登录页
            if (response.status === 401) {
                localStorage.removeItem('admin_token');
                window.location.href = '/login';
                return;
            }
            
            return response.json();
        }
        
        // 登录处理
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 保存JWT token到localStorage和Cookie
                    localStorage.setItem('admin_token', result.token);
                    document.cookie = `admin_token=${result.token}; path=/; max-age=86400`;
                    
                    // 验证token是否有效
                    try {
                        const testResponse = await fetch('/dashboard', {
                            method: 'GET',
                            headers: {
                                'Authorization': `Bearer ${result.token}`
                            }
                        });
                        if (testResponse.ok) {
                            window.location.href = '/dashboard';
                        } else {
                            errorMsg.textContent = 'Token验证失败，请重试';
                            errorMsg.classList.add('show');
                            localStorage.removeItem('admin_token');
                            document.cookie = 'admin_token=; path=/; max-age=0';
                        }
                    } catch (e) {
                        errorMsg.textContent = '网络错误: ' + e.message;
                        errorMsg.classList.add('show');
                        localStorage.removeItem('admin_token');
                        document.cookie = 'admin_token=; path=/; max-age=0';
                    }
                } else {
                    errorMsg.textContent = result.message || '登录失败';
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                errorMsg.textContent = '网络错误，请稍后重试';
                errorMsg.classList.add('show');
            }
        });
    </script>
</body>
</html>
