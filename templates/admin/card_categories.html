{% extends "admin/base.html" %}

{% block title %}卡片分类管理{% endblock %}

{% block content %}
<div class="page-header">
    <h1>卡片分类管理</h1>
    <div class="breadcrumb">首页 / 卡片分类管理</div>
</div>

<div class="card">
    <div class="card-header">
        <h2>分类列表</h2>
        <button class="btn btn-primary" onclick="showAddModal()">+ 添加分类</button>
    </div>

    <div class="table-container" id="categoriesTable">
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">ID</th>
                    <th>分类名称</th>
                    <th>描述</th>
                    <th style="width: 80px; text-align: center;">排序</th>
                    <th style="width: 80px; text-align: center;">卡片数</th>
                    <th style="width: 90px; text-align: center;">状态</th>
                    <th style="width: 180px; text-align: center;">操作</th>
                </tr>
            </thead>
            <tbody id="categoriesBody">
                <!-- 数据将通过JavaScript动态加载 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 添加/编辑分类模态框 -->
<div id="categoryModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">添加分类</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="categoryForm">
                <input type="hidden" id="categoryId">
                
                <div class="form-group">
                    <label for="categoryName">分类名称 <span class="required">*</span></label>
                    <input type="text" id="categoryName" class="form-control" required placeholder="请输入分类名称">
                    <div class="form-hint">例如：物理环境、网络问题、认证问题</div>
                </div>

                <div class="form-group">
                    <label for="categoryDescription">分类描述</label>
                    <textarea id="categoryDescription" class="form-control" rows="3" placeholder="请输入分类描述（可选）"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="categorySortOrder">排序</label>
                        <input type="number" id="categorySortOrder" class="form-control" value="0" min="0">
                        <div class="form-hint">数字越小越靠前</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="categoryIsActive" checked>
                        <span class="checkmark"></span>
                        启用分类
                    </label>
                    <div class="form-hint">禁用后该分类将不会在下拉选项中出现</div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveCategory()">保存</button>
        </div>
    </div>
</div>

<!-- 删除确认模态框 -->
<div id="deleteModal" class="modal">
    <div class="modal-content modal-sm">
        <div class="modal-header">
            <h3>确认删除</h3>
            <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="warning-icon">⚠️</div>
            <p>确定要删除分类 <strong id="deleteCategoryName"></strong> 吗？</p>
            <p class="text-muted">此操作不可恢复，请谨慎操作。</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeDeleteModal()">取消</button>
            <button class="btn btn-danger" onclick="confirmDelete()">确认删除</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let deleteCategoryId = null;

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
    // 检查是否有flash消息
    const flashMessage = sessionStorage.getItem('flashMessage');
    if (flashMessage) {
        const msg = JSON.parse(flashMessage);
        showMessage(msg.type, msg.message);
        sessionStorage.removeItem('flashMessage');
    }
    
    // 从API加载分类数据
    loadCategories();
});

// 加载分类列表
async function loadCategories() {
    try {
        const response = await fetch('/api/card-categories');
        if (!response.ok) throw new Error('加载分类数据失败');
        
        const categories = await response.json();
        renderCategories(categories);
    } catch (error) {
        console.error('加载分类失败:', error);
        showMessage('error', '加载分类数据失败: ' + error.message);
    }
}

// 渲染分类表格
function renderCategories(categories) {
    const tbody = document.querySelector('tbody');
    if (!tbody) return;
    
    if (categories.length === 0) {
        // 显示空状态
        const card = tbody.closest('.table-container');
        if (card) {
            card.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📁</div>
                    <p>暂无卡片分类</p>
                    <button class="btn btn-primary" onclick="showAddModal()">添加第一个分类</button>
                </div>
            `;
        }
        return;
    }
    
    let html = '';
    categories.forEach(category => {
        html += `
            <tr>
                <td style="text-align: center;">${category.id}</td>
                <td><strong>${category.name}</strong></td>
                <td>${category.description ? category.description.substring(0, 40) + (category.description.length > 40 ? '...' : '') : '-'}</td>
                <td style="text-align: center;">${category.sort_order}</td>
                <td style="text-align: center;">${category.card_count}</td>
                <td style="text-align: center;">
                    <span class="status-tag ${category.is_active ? 'status-active' : 'status-inactive'}">
                        ${category.is_active ? '启用' : '禁用'}
                    </span>
                </td>
                <td style="text-align: center;">
                    <button class="btn btn-default btn-sm" onclick="editCategory(${category.id})">编辑</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteCategory(${category.id}, '${category.name}')">删除</button>
                </td>
            </tr>
        `;
    });
    
    tbody.innerHTML = html;
}

// 显示添加模态框
function showAddModal() {
    document.getElementById('modalTitle').textContent = '添加分类';
    document.getElementById('categoryForm').reset();
    document.getElementById('categoryId').value = '';
    document.getElementById('categoryModal').classList.add('show');
}

// 关闭模态框
function closeModal() {
    document.getElementById('categoryModal').classList.remove('show');
}

// 编辑分类
async function editCategory(id) {
    try {
        const response = await fetch(`/api/card-categories/${id}`);
        if (!response.ok) throw new Error('获取分类信息失败');
        
        const category = await response.json();
        
        document.getElementById('modalTitle').textContent = '编辑分类';
        document.getElementById('categoryId').value = category.id;
        document.getElementById('categoryName').value = category.name;
        document.getElementById('categoryDescription').value = category.description || '';
        document.getElementById('categorySortOrder').value = category.sort_order;
        document.getElementById('categoryIsActive').checked = category.is_active;
        
        document.getElementById('categoryModal').classList.add('show');
    } catch (error) {
        showMessage('error', '获取分类信息失败: ' + error.message);
    }
}

// 保存分类
async function saveCategory() {
    const id = document.getElementById('categoryId').value;
    const name = document.getElementById('categoryName').value.trim();
    
    if (!name) {
        showMessage('error', '请输入分类名称');
        document.getElementById('categoryName').focus();
        return;
    }

    const data = {
        name: name,
        description: document.getElementById('categoryDescription').value.trim(),
        sort_order: parseInt(document.getElementById('categorySortOrder').value) || 0,
        is_active: document.getElementById('categoryIsActive').checked
    };

    try {
        const url = id ? `/api/card-categories/${id}` : '/api/card-categories';
        const method = id ? 'PUT' : 'POST';
        
        const response = await fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        });
        
        if (!response.ok) {
            const result = await response.json();
            throw new Error(result.error || '操作失败');
        }
        
        // 保存成功后显示提示并重定向到列表页
        sessionStorage.setItem('flashMessage', JSON.stringify({
            type: 'success',
            message: id ? '分类已更新' : '分类已创建'
        }));
        location.reload();
        closeModal();
    } catch (error) {
        showMessage('error', '操作失败: ' + error.message);
    }
}

// 显示删除确认
function deleteCategory(id, name) {
    deleteCategoryId = id;
    document.getElementById('deleteCategoryName').textContent = name;
    document.getElementById('deleteModal').classList.add('show');
}

// 关闭删除确认
function closeDeleteModal() {
    deleteCategoryId = null;
    document.getElementById('deleteModal').classList.remove('show');
}

// 确认删除
async function confirmDelete() {
    if (!deleteCategoryId) return;

    try {
        const response = await fetch(`/api/card-categories/${deleteCategoryId}`, {
            method: 'DELETE'
        });
        
        if (!response.ok) {
            const result = await response.json();
            throw new Error(result.error || '删除失败');
        }
        
        sessionStorage.setItem('flashMessage', JSON.stringify({
            type: 'success',
            message: '分类已删除'
        }));
        location.reload();
        closeDeleteModal();
    } catch (error) {
        showMessage('error', '删除失败: ' + error.message);
    }
}

// 点击模态框外部关闭
document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', function(e) {
        if (e.target === this) {
            closeModal();
            closeDeleteModal();
        }
    });
});

// 回车保存
document.getElementById('categoryForm').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        saveCategory();
    }
});
</script>
{% endblock %}
